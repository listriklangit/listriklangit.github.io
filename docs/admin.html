<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — PT Listrik Langit</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b sticky top-0 z-[1000]">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2 font-extrabold"><img src="./logo.svg" class="h-8" alt="logo"/> Admin PLTS</a>
      <div class="flex gap-2 items-center">
        <a href="./index.html" class="text-sm font-bold border px-3 py-1.5 rounded-lg">← Lihat peta</a>
        <button id="btn-logout" class="hidden text-sm font-bold bg-slate-900 text-white px-3 py-1.5 rounded-lg">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- Login -->
    <section id="view-login" class="max-w-md mx-auto bg-white border rounded-2xl p-6">
      <h1 class="font-extrabold text-xl">Login admin</h1>
      <p class="text-sm text-slate-500 mt-1">Akun dibuat manual di Supabase Dashboard → Authentication → Users. Tidak ada registrasi publik.</p>
      <form id="login-form" class="mt-4 space-y-3">
        <input id="login-email" type="email" required placeholder="Email admin" class="w-full border rounded-lg px-3 py-2 text-sm" />
        <input id="login-pass" type="password" required placeholder="Password" class="w-full border rounded-lg px-3 py-2 text-sm" />
        <button class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg px-3 py-2 text-sm">Masuk</button>
        <p id="login-status" class="text-xs text-slate-500"></p>
      </form>
    </section>

    <!-- Panel -->
    <section id="view-panel" class="hidden">
      <div class="flex flex-wrap gap-2 mb-4">
        <button data-tab="lokasi" class="tab-btn active text-sm font-bold border px-3 py-1.5 rounded-lg">Lokasi</button>
        <button data-tab="tambah" class="tab-btn text-sm font-bold border px-3 py-1.5 rounded-lg">+ Tambah / Edit</button>
        <button data-tab="review" class="tab-btn text-sm font-bold border px-3 py-1.5 rounded-lg">Moderasi review <span id="review-count" class="ml-1 bg-amber-500 text-white text-[11px] px-1.5 rounded-full">0</span></button>
      </div>

      <!-- Tab: tabel lokasi -->
      <div id="tab-lokasi" class="bg-white border rounded-2xl p-4">
        <div class="flex gap-2 mb-3">
          <input id="admin-search" placeholder="Cari lokasi…" class="flex-1 border rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-500 border-b">
              <th class="py-2 pr-2">Nama</th><th class="pr-2">Provinsi</th><th class="pr-2">kWp</th><th class="pr-2">Tahun</th><th class="pr-2">Publish</th><th>Aksi</th>
            </tr></thead>
            <tbody id="loc-rows"></tbody>
          </table>
        </div>
      </div>

      <!-- Tab: form -->
      <div id="tab-tambah" class="hidden bg-white border rounded-2xl p-4 grid md:grid-cols-2 gap-4">
        <form id="loc-form" class="space-y-2 text-sm">
          <input type="hidden" id="loc-id" />
          <label class="block">Nama*<input id="loc-name" required class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="PLTS Atap …" /></label>
          <label class="block">Slug (unik, ex: plts-surabaya-50kwp)<input id="loc-slug" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
          <div class="grid grid-cols-2 gap-2">
            <label class="block">Provinsi*<select id="loc-prov" required class="mt-1 w-full border rounded-lg px-3 py-2"></select></label>
            <label class="block">Kota<input id="loc-city" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <label class="block">Lat*<input id="loc-lat" required type="number" step="any" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
            <label class="block">Lng*<input id="loc-lng" required type="number" step="any" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
          </div>
          <p class="text-xs text-slate-500">Klik peta di kanan untuk isi lat/lng otomatis.</p>
          <div class="grid grid-cols-3 gap-2">
            <label class="block">kWp*<input id="loc-kwp" required type="number" step="any" min="0" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
            <label class="block">Tipe*<select id="loc-tipe" class="mt-1 w-full border rounded-lg px-3 py-2"><option>On-Grid</option><option>Off-Grid</option><option>Hybrid</option></select></label>
            <label class="block">Tahun*<input id="loc-year" required type="number" min="2000" max="2100" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
          </div>
          <label class="block">Klien<input id="loc-client" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
          <label class="block">Deskripsi<textarea id="loc-desc" rows="3" class="mt-1 w-full border rounded-lg px-3 py-2"></textarea></label>
          <label class="block">YouTube URL<input id="loc-yt" placeholder="https://youtu.be/…" class="mt-1 w-full border rounded-lg px-3 py-2" /></label>
          <label class="flex items-center gap-2"><input id="loc-pub" type="checkbox" checked class="w-4 h-4" /> Publish (tampil di peta publik)</label>
          <label class="block">Cover foto<input id="loc-cover" type="file" accept="image/jpeg,image/png,image/webp" class="mt-1 w-full text-xs" /></label>
          <label class="block">Foto tambahan (bisa banyak)<input id="loc-photos" type="file" multiple accept="image/jpeg,image/png,image/webp" class="mt-1 w-full text-xs" /></label>
          <div class="flex gap-2">
            <button class="bg-slate-900 text-white font-bold px-4 py-2 rounded-lg">Simpan</button>
            <button type="button" id="form-reset" class="border font-bold px-4 py-2 rounded-lg">Reset</button>
          </div>
          <p id="form-status" class="text-xs text-slate-500"></p>
        </form>
        <div>
          <div id="picker-map" class="w-full h-[320px] rounded-xl border"></div>
          <div id="edit-photos" class="mt-3 space-y-2 text-xs"></div>
        </div>
      </div>

      <!-- Tab: moderasi -->
      <div id="tab-review" class="hidden bg-white border rounded-2xl p-4">
        <h2 class="font-bold text-sm mb-2">Menunggu persetujuan (is_approved = false)</h2>
        <div id="pending-reviews" class="space-y-2 text-sm"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./js/config.js"></script>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
